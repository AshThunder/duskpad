# Local Midnight stack for DuskPad development (ledger 8): node 1.0.400, indexer 4.3.5, proof server 8.1.0.
# Host networking: the proof server must reach the internet to fetch SRS params, and Docker's
# embedded DNS was unreliable in compose networks on our dev box.
# Usage: docker compose -f docker/stack.yml up -d
services:
  proof-server:
    container_name: 'midnight-proof-server'
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server', '-v']
    network_mode: host
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    container_name: 'midnight-indexer'
    image: 'midnightntwrk/indexer-standalone:4.3.5'
    env_file: standalone.env
    network_mode: host
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://127.0.0.1:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://127.0.0.1:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.400'
    container_name: 'midnight-node'
    network_mode: host
    healthcheck:
      # Gate on block #1 existing, not merely on the RPC port answering. The
      # indexer's spo-indexer resolves block #1 immediately on startup and exits
      # non-zero with "Cannot construct OnlineClientAtBlock: block number 1 not
      # found" if the node is still at genesis, a race it loses by ~1s. The
      # node answers /health well before it authors block #1, so a /health-only
      # check lets `depends_on: service_healthy` release the indexer too early.
      test:
        [
          'CMD-SHELL',
          'curl -sf -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"chain_getBlockHash\",\"params\":[1]}" http://localhost:9944 | grep -q "\"result\":\"0x"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
